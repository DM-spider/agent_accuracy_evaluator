[app]
host = "127.0.0.1"
port = 8765
timezone = "Asia/Shanghai"
open_browser = true

[paths]
# 留空则使用本工具 data/golden 与 runtime/。
# 所有运行配置只从 settings.toml 读取。
golden_dir = ""
runtime_dir = ""

[database]
# 只读账号。密码填写在本机 settings.toml 中，该文件不会提交到 Git。
host = "127.0.0.1"
port = 5432
name = "example_db"
user = ""
password = ""
timeout_seconds = 600
# ODPS 等外部表单条查询是远程作业，实测单次约两分钟，按实际调大 timeout_seconds；
# 与 golden_builder 的 600 秒预算保持一致。connect_timeout 只用于建连，不会提前掐断查询。
max_rows = 5000
connect_timeout = 15

[agent]
# 普通 HTTP 智能体接口。token 只从本文件读取。
url = ""
token = ""
method = "POST"
timeout_seconds = 90
retries = 2
retry_backoff_seconds = 1.5
concurrency = 3
header_name = "Authorization"
header_template = "Bearer {token}"
answer_path = "answer"
request_template = """
{
  "question": "{question}",
  "case_id": "{case_id}",
  "anchor_time": "{anchor_time}",
  "timezone": "{timezone}"
}
"""

[watermark]
enabled = true
timestamp_columns = ["updated_at", "sjsj", "etl_time", "load_time", "modify_time"]

[evaluator_llm]
# OpenAI-compatible 评估模型。api_key 只从本文件读取。
enabled = true
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
api_key = ""
timeout_seconds = 90
retries = 2
temperature = 0
max_output_tokens = 8000
max_input_chars = 500000
min_confidence = 0.70
prompt_version = "v1"

[platform]
# 将浏览器 Copy as cURL (bash) 的完整内容粘贴到下面三单引号之间。
# 会话和登录信息只从此处解析，修改后重启服务。此文件含登录凭证，请勿分享。
curl = '''
'''
enabled = true
read_timeout_seconds = 180
total_timeout_seconds = 600
# 平台明确返回 response.failed 等终态失败时重发整轮，两次尝试之间等这么多秒。
# 断流（没收到 response.completed）不重发：那轮可能仍在服务端执行。
retries = 2
retry_backoff_seconds = 5
trust_env = false
